<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite nicht gefunden | CreationFirst</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0a0e1a">
<!--
  Self-contained on purpose: a 404 can be served for any missing URL at any depth,
  so it must not depend on relative asset paths. Links are resolved against the site
  root at runtime, which works on the GitHub Pages project path (/creationfirst/)
  and on a custom domain alike.
-->
<script>
(function () {
  var p = location.pathname, i = p.indexOf("/creationfirst/");
  var base = i === 0 ? "/creationfirst/" : "/";
  document.write('<base href="' + base + '">');
})();
</script>
<link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
<style>

  html,body{height:100%;margin:0}
  body{

    background:radial-gradient(120% 140% at 10% 0%,#1c2340 0%,#0a0e1a 55%);
    color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;padding:48px 24px}

  .code{font-size:clamp(4.5rem,18vw,6.5rem);font-weight:800;line-height:1;margin:0 0 12px;letter-spacing:-.04em;

  h1{font-size:22px;margin:0 0 14px;letter-spacing:-.01em}

  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 24px;border-radius:999px;font-weight:650;font-size:15px;text-decoration:none;transition:transform .15s ease,border-color .15s ease}
  .btn:hover{transform:translateY(-2px)}
  .btn:focus-visible{outline:3px solid #22d3ee;outline-offset:3px}
  .btn-primary{background:linear-gradient(120deg,#4f46e5 0%,#6d5ef8 45%,#22d3ee 100%);color:#fff}
  .btn-ghost{color:#fff;border:1px solid rgba(255,255,255,.3)}

  .small{margin-top:28px;font-size:13.5px;color:#8b92ab}

</style>
</head>
<body>
